name: Weekly Project
run-name: ${{ github.event.head_commit.message }}
on:
  push:
    tags:
      - "v*"
jobs:
  react-project-image:
    name: "Build React app"
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.upload-dist.outputs.artifact-id }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
      - name: Setup nodejs version
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Installing node dependencies
        run: npm ci
      - name: Build app
        run: npm run build
      - name: Save artifact
        id: upload-dist
        uses: actions/upload-artifact@v7
        with:
          name: build-result
          path: dist/
  release-app:
    name: "Release built app"
    needs: react-project-image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.react-project-image.outputs.artifact-id }}
          path: build-result
      - name: Compress artifact
        run: |
          cd build-result
          zip -r ../react-app.zip .
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: react-app.zip
          overwrite_files: true
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
  build-and-push:
    name: "Build and push image"
    needs: react-project-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_BACKEND_URL=${{ vars.VITE_BACKEND_URL }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/belimudah-frontend:latest
            ghcr.io/${{ github.repository_owner }}/belimudah-frontend:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy-image:
    name: "Deploy image into server"
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Pull and restart via docker compose
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd server
            docker compose pull
            docker compose up -d
            docker image prune -f
